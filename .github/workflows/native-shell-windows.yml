name: Sk/Ai Native Shell

on:
  pull_request:
    branches:
      - main
    paths:
      - "browser-shell/**"
      - ".github/workflows/native-shell-windows.yml"
  workflow_dispatch:


jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Windows toolchain
        shell: pwsh
        run: |
          cmake --version
          node --version
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -latest -products '*' -property installationVersion
          }
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -Directory |
            Select-Object -ExpandProperty Name

      - name: Download pinned CEF distribution
        shell: pwsh
        run: |
          $version = "154.0.34+g14c5a08+chromium-154.0.8037.98"
          $archive = "cef_binary_$($version)_windows64.tar.bz2"
          $base = "https://cef-builds.spotifycdn.com/$archive"
          $encoded = $base.Replace("+", "%2B")
          $folder = Join-Path $env:RUNNER_TEMP "cef"
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          $archivePath = Join-Path $folder $archive
          Invoke-WebRequest -Uri "$encoded.sha1" -OutFile "$archivePath.sha1"
          Invoke-WebRequest -Uri $encoded -OutFile $archivePath
          $expected = (Get-Content "$archivePath.sha1" -Raw).Trim().Split(" ")[0].ToLowerInvariant()
          $actual = (Get-FileHash $archivePath -Algorithm SHA1).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "CEF SHA-1 verification failed." }
          tar -xjf $archivePath -C $folder
          $cefRoot = Join-Path $folder "cef_binary_$($version)_windows64"
          if (!(Test-Path (Join-Path $cefRoot "Release\bootstrap.exe"))) {
            throw "Pinned CEF package does not contain Release\bootstrap.exe required for the sandbox bootstrap."
          }
          "CEF_ROOT=$cefRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Check JavaScript syntax
        run: |
          node --check browser-shell/ui/app.js
          node --check browser-shell/ui/assistant.js

      - name: Configure native shell
        shell: pwsh
        run: |
          cmake -S browser-shell -B build/skai -A x64 -DCEF_ROOT="$env:CEF_ROOT" -DUSE_SANDBOX=ON

      - name: Build native shell
        run: cmake --build build/skai --config Release --parallel 2

      - name: Verify packaged runtime
        shell: pwsh
        run: |
          $bin = Join-Path $PWD "build/skai/bin/Release"
          $required = @(
            "SkAi.exe",
            "SkAi.dll",
            "libcef.dll",
            "chrome_elf.dll",
            "icudtl.dat",
            "resources.pak",
            "ui/index.html",
            "ui/assistant.html",
            "ui/assistant.css",
            "ui/assistant.js",
            "chrome_100_percent.pak",
            "chrome_200_percent.pak"
          )
          foreach ($item in $required) {
            $path = Join-Path $bin $item
            if (!(Test-Path $path)) { throw "Required runtime file missing: $path" }
          }
          if (!(Test-Path (Join-Path $bin "locales\en-US.pak"))) {
            throw "CEF locale resources were not packaged."
          }
          Get-ChildItem $bin -Force | Select-Object Name, Length

      - name: Native window smoke test
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "build/skai/bin/Release/SkAi.exe"
          $process = Start-Process -FilePath $exe -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(35)
            $windowFound = $false
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) {
                throw "Sk/Ai exited early with code $($process.ExitCode)."
              }
              if ($process.MainWindowHandle -ne 0) {
                $windowFound = $true
                break
              }
            }
            if (!$windowFound) {
              throw "Sk/Ai did not create a visible native window within 35 seconds."
            }
          }
          finally {
            if (!$process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Upload Windows x64 runtime
        uses: actions/upload-artifact@v4
        with:
          name: skai-win-x64-runtime
          path: build/skai/bin/Release/
          if-no-files-found: error
          retention-days: 14
