name: Build Yandex Blind for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
      - "installer/**"
      - "newtab/**"
      - "README.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and verify Chromium-Gost x64 MSI
        shell: pwsh
        run: |
          $version = "156.0.8078.88"
          $asset = "chromium-gost-$version-windows-amd64.msi"
          $url = "https://github.com/deemru/Chromium-Gost/releases/download/$version/$asset"
          $expected = "ba38c6b7e8272104c9323538735d75dd2de4f7a63f82694122464f4b6495c9ad"
          New-Item -ItemType Directory -Force -Path "dist\upstream", "dist\browser" | Out-Null
          $msi = Join-Path $PWD "dist\upstream\$asset"
          Invoke-WebRequest -Uri $url -OutFile $msi
          $actual = (Get-FileHash -Path $msi -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "SHA-256 mismatch. Expected $expected, got $actual"
          }
          $target = Join-Path $PWD "dist\upstream\extracted"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          $log = Join-Path $PWD "dist\upstream\msiexec.log"
          $arguments = @("/a", $msi, "/qn", "TARGETDIR=$target", "/l*v", $log)
          $process = Start-Process -FilePath "msiexec.exe" -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "MSI administrative extraction failed: $($process.ExitCode). See $log" }
          $chrome = Get-ChildItem -Path $target -Filter "chrome.exe" -File -Recurse | Select-Object -First 1
          if (-not $chrome) { throw "chrome.exe was not found in the extracted x64 MSI." }
          Copy-Item -Path (Join-Path $chrome.Directory.FullName "*") -Destination "dist\browser" -Recurse -Force
          if (-not (Test-Path "dist\browser\chrome.exe")) { throw "Browser packaging failed." }
          "Verified upstream version: $version (Windows x64 MSI)" | Out-File "dist\UPSTREAM.txt" -Encoding utf8
          "SHA256: $actual" | Out-File "dist\UPSTREAM.txt" -Append -Encoding utf8

      - name: Prepare Yandex Blind files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist\payload\Browser", "dist\payload\NewTab" | Out-Null
          Copy-Item "dist\browser\*" "dist\payload\Browser" -Recurse -Force
          Copy-Item "newtab\*" "dist\payload\NewTab" -Recurse -Force
          Copy-Item "installer\YandexBlind.vbs" "dist\payload\YandexBlind.vbs" -Force
          Copy-Item "dist\UPSTREAM.txt" "dist\payload\UPSTREAM.txt" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "installer\YandexBlind.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "dist\YandexBlind-Setup.exe")) { throw "Installer output is missing." }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: YandexBlind-Windows11-x64
          path: dist/YandexBlind-Setup.exe
          if-no-files-found: error
          retention-days: 14
