name: Build Sk/Ai for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/sk-ai-privacy-security
    paths:
      - ".github/workflows/build.yml"
      - "installer/**"
      - "newtab/**"
      - "README.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and verify Chromium-Gost x64 ZIP
        shell: pwsh
        run: |
          $version = "156.0.8078.88"
          $asset = "chromium-gost-$version-windows-amd64.zip"
          $url = "https://github.com/deemru/Chromium-Gost/releases/download/$version/$asset"
          $expected = "c373932d56d8af7d7ca7d1e6b5cfb4458d75d29be972f9a276f76e62085fb1b2"
          New-Item -ItemType Directory -Force -Path "dist\upstream", "dist\browser" | Out-Null
          $archive = Join-Path $PWD "dist\upstream\$asset"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Chromium-Gost SHA-256 mismatch. Expected $expected, got $actual"
          }
          $target = Join-Path $PWD "dist\upstream\expanded"
          Expand-Archive -Path $archive -DestinationPath $target -Force
          $chrome = Get-ChildItem -Path $target -Filter "chrome.exe" -File -Recurse | Select-Object -First 1
          if (-not $chrome) { throw "chrome.exe was not found in the verified x64 ZIP." }
          Copy-Item -Path (Join-Path $chrome.Directory.FullName "*") -Destination "dist\browser" -Recurse -Force
          if (-not (Test-Path "dist\browser\chrome.exe")) { throw "Browser packaging failed." }
          "Verified upstream version: $version (Windows x64 ZIP)" | Out-File "dist\UPSTREAM.txt" -Encoding utf8
          "SHA256: $actual" | Out-File "dist\UPSTREAM.txt" -Append -Encoding utf8

      - name: Download local Qwen runtime and model
        shell: pwsh
        run: |
          $runtimeTag = "b12248"
          $runtimeAsset = "llama-$runtimeTag-bin-win-cpu-x64.zip"
          $runtimeUrl = "https://github.com/ggml-org/llama.cpp/releases/download/$runtimeTag/$runtimeAsset"
          New-Item -ItemType Directory -Force -Path "dist\llama", "dist\payload\AI\models" | Out-Null
          $runtimeZip = Join-Path $PWD "dist\llama\$runtimeAsset"
          Invoke-WebRequest -Uri $runtimeUrl -OutFile $runtimeZip
          Expand-Archive -Path $runtimeZip -DestinationPath "dist\llama\expanded" -Force
          $server = Get-ChildItem -Path "dist\llama\expanded" -Filter "llama-server.exe" -File -Recurse | Select-Object -First 1
          if (-not $server) { throw "llama-server.exe was not found in the official CPU runtime archive." }
          Copy-Item -Path (Join-Path $server.Directory.FullName "*") -Destination "dist\payload\AI" -Recurse -Force
          if (-not (Test-Path "dist\payload\AI\llama-server.exe")) { throw "Could not stage llama-server.exe." }

          $modelName = "qwen3.5-2b-Q4_K_M.gguf"
          $modelUrl = "https://huggingface.co/gguf/Qwen3.5-2B-GGUF/resolve/main/$modelName"
          $modelPath = "dist\payload\AI\models\$modelName"
          Invoke-WebRequest -Uri $modelUrl -OutFile $modelPath
          $expectedModelSha = "9a3d0aa6c920f096441139b6a254542da855223fdad06855ea00c6c087fd713d"
          $actualModelSha = (Get-FileHash -Path $modelPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualModelSha -ne $expectedModelSha) {
            throw "Qwen model SHA-256 mismatch. Expected $expectedModelSha, got $actualModelSha"
          }
          "Qwen3.5-2B Q4_K_M SHA256: $actualModelSha" | Out-File "dist\payload\AI\MODEL.txt" -Encoding utf8
          "llama.cpp runtime: $runtimeTag (Windows x64 CPU)" | Out-File "dist\payload\AI\RUNTIME.txt" -Encoding utf8

      - name: Prepare Sk/Ai files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist\payload\Browser", "dist\payload\NewTab" | Out-Null
          Copy-Item "dist\browser\*" "dist\payload\Browser" -Recurse -Force
          Copy-Item "newtab\*" "dist\payload\NewTab" -Recurse -Force
          Copy-Item "installer\YandexBlind.vbs" "dist\payload\YandexBlind.vbs" -Force
          Copy-Item "dist\UPSTREAM.txt" "dist\payload\UPSTREAM.txt" -Force
          @"
          Sk/Ai bundles llama.cpp as a local inference runtime.
          Runtime source: https://github.com/ggml-org/llama.cpp
          Model: Qwen3.5-2B-GGUF (Q4_K_M)
          Model source: https://huggingface.co/gguf/Qwen3.5-2B-GGUF
          The AI server binds only to 127.0.0.1 and is launched only while the browser is open.
          "@ | Out-File "dist\payload\AI\THIRD_PARTY_NOTICES.txt" -Encoding utf8

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "installer\YandexBlind.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "dist\SkAi-Windows11-x64-Setup.exe")) { throw "Installer output is missing." }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SkAi-Windows11-x64
          path: dist/SkAi-Windows11-x64-Setup.exe
          if-no-files-found: error
          retention-days: 14
